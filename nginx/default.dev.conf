## Dev: фронт — node dev server на :3000
##       proxy_pass http://frontend:3000
## Prod: фронт — nginx внутри контейнера на :80
##       proxy_pass http://frontend:80
## Файл одинаковый для обоих режимов — в prod можно поменять порт на 80,
## но проще держать два конфига (см. ниже).

server {
    listen 80;
    client_max_body_size 50M;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";  # нужно для WebSocket hot-reload CRA
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}